meta:
  source: "DESIGN_common_deterministic_integration.md §17.2/§17.5 + flus-main/app/common 전수 대조"
  as_of: "2026-06-16"
  classes: [DET, STUB, UNREACHABLE, ABSENT, MANUAL, DET-PARTIAL]
  notes: >
    DET=실결정론 / STUB=placeholder(lambda:True·빈본문) / UNREACHABLE=도달불가 dead /
    ABSENT=함수없음 / MANUAL=(*)/M 수동 / DET-PARTIAL=variant의존(variants 맵 필수).
    어댑터(det_adapters/base.py)는 common 호출 전 이 표를 보고 DET가 아니면 handled=False.
    조회 계약: items[item_id] 없으면 ABSENT 취급. variants 있으면 실제 variant 문자열로
    조회하되 못 찾으면 엔진 토큰(variant.split('_')[0])으로 재조회, 그래도 없으면 default,
    없으면 ABSENT. variants 없으면 default.
    서버 분류 합계(xlsx 106개 전수): DET 36 + DET-PARTIAL 13(auto, 서비스active시 수동분기) +
    DET-PARTIAL(linux-override) 5(auto_parse MANUAL, linux_parse DET) + MANUAL 13 + ABSENT 39.
    §17.5 설계서 비교: DET 38(+5Linux)≒DET 36+PARTIAL 5, DET+MANUAL 16≒DET-PARTIAL 13, MANUAL 13=MANUAL 13, ABSENT 38≒39(SRV-179 D라벨 포함).
    ※DET-PARTIAL(linux-override): SRV-026/069/074/127/131 — auto_parse stub, linux_parse DET(§16.3).
    ※SRV-012/121/122는 DET((*) = error fallback만, 주 경로 결정론).
    ※SRV-165/166은 MANUAL(항상 (*) 반환, 결정론 verdict 없음).
    ※SRV-010은 DET이나 sendmail 분기에 판정 역전 버그(KNOWN_BUGS: SRV-010-polarity).
    컨테이너(PRCC) 분류 합계(50개 전수, Phase 2, autoAnalysis.py 코드 직접 근거):
      순수 DET(전 활성 variant N/Y): 39항목.
      DET-PARTIAL(variant 맵 DET+MANUAL 혼재): 8항목(PRCC-004/010/017/018/022/024/036/039).
      MANUAL(전 활성 variant M, 또는 단일 active variant에 M경로 지배): 3항목(PRCC-011).
      → 실제 MANUAL-ALL=1(PRCC-011), DET-PARTIAL=8, 나머지 DET.
      ABSENT=0(PRCC 전 항목 elif 분기 존재). UNREACHABLE=0. STUB=0.
      DET_SOURCE 미기재 variant는 ABSENT 취급(gate 차단=안전 기본값).
    타 도메인(DB/네트워크/PRCV/웹) 전수 분류는 해당 롤아웃 Phase에서 추가 —
    현재는 버그/회귀 항목만 시드.

# ─── 서버(SRV) 전수 분류 ────────────────────────────────────────────────────
# 분류 근거:
#   DET     - common 함수 있음, (*) 없거나 error-fallback-only
#   DET-PARTIAL - linux_parse가 오버라이드하는 5건(auto_parse stub, linux_parse DET)
#              또는 서비스 활성 시 수동 경로 존재(FTP/DNS active→(*))
#   MANUAL  - 함수 있으나 즉각 (*) 반환 (4~5줄, 주 판정 없음)
#   ABSENT  - function_dispatcher에 없고 SRV_Linux_parse에도 없음

