# ─── 타 도메인: 버그/회귀테스트 필요 항목 시드 ──────────────────────────────
# (전수 분류는 해당 롤아웃 Phase에서 추가)

  # ─── DB(DBM) 전수 분류 — Phase 4 (2026-06-16) ───────────────────────────────
  # 근거 약칭: m=mysql, o=oracle, s=mssql, ma=mariadb, p=postgresql analysis.py
  # ★ STUB = lambda True(무조건 위반), 빈 본문, .run 미호출
  # ★ ABSENT = .run에서 호출 안됨 or 엔진에 해당 없음
  # ★ MANUAL = 해시크랙, 인터뷰, 콘솔 확인 필요
  # lambda True(무조건 위반)는 거짓취약 위험 → STUB 확정
  #
  # 설계서 §B 대비 검증 결과(Sonnet, 코드 직접 확인):
  #   oracle DBM-013: §B=ABSENT 기재, 코드에서 [lambda datum: True] 확인 → STUB으로 정정.
  #   oracle DBM-015_1/_2: §B=DET 기재(원문 "lambda True 혼재 → 듀얼런 검증"), 코드에서 015_1/2 모두 [lambda datum: True] 확인 → STUB으로 정정.
  #   mssql DBM-011: 빈 본문(dbm_result=[]만) → STUB 확정.
  #   mssql DBM-013: 빈 본문 → STUB 확정(§B=MANUAL이었으나 빈본문이므로 STUB이 보수적).
  #   mssql DBM-017: 빈 본문 → STUB 확정(§B=MANUAL, 빈본문=STUB 보수적).
  #   mssql DBM-021: 빈 본문 → STUB 확정(§B=MANUAL, 빈본문=STUB).
  #   mssql DBM-022: 빈 본문 → STUB 확정(§B=STUB 일치).
  #   pg DBM-006/007/013/019: 빈 본문 → STUB 확정.
  #   mariadb DBM-016/025: 빈 본문 → STUB 확정.

  DBM-001:                          # Phase 4c: (b) 사전공격 결정론화 — 네이티브 DET 승격
    variants:
      # ── native 변형: db_pwcrack 어댑터 (b 레이어) ─────────────────────────
      mysql: DET            # caching_sha2 비활성→미지원포맷 판단보류, native=DET
      oracle: DET           # spare4 미수집 → 증거가드로 handled=False (크랙코드 준비됨)
      mssql: DET            # 0x0200/0x0100 SHA512/SHA1 지원
      mariadb: DET          # mysql_native_password *40HEX 지원
      pg: DET               # SCRAM-SHA-256 / md5 지원
      # ── 클라우드 변형: 데이터 없으면 증거가드 폴백, 데이터 있으면 crack_judge 호출 ──
      mysql_rds: DET
      mysql_aurora: DET
      mysql_azure: DET
      oracle_rds: DET       # 데이터 없으면 어차피 증거가드 handled=False
      mariadb_rds: DET
      # mssql/pg cloud: dbm_001 메서드 없음 → ABSENT 명시 필수
      # (engine-token 폴백이 native DET 반환하므로 명시 없으면 DET로 잘못 분류)
      mssql_rds: ABSENT     # cloud mssql에 dbm_001 없음 → ABSENT
      pg_rds: ABSENT        # cloud pg에 dbm_001 없음 → ABSENT
      pg_aurora: ABSENT     # cloud pg에 dbm_001 없음 → ABSENT
      pg_azure: ABSENT      # cloud pg에 dbm_001 없음 → ABSENT
    default: ABSENT

  DBM-003:                          # 불필요 계정
    variants:
      mysql: DET
      oracle: DET
      mssql: DET
      mariadb: DET
      pg: STUB
      # 클라우드 변형 (Phase 4b): 동일 CloudAnalysis 1클래스가 rds/aurora/azure 처리
      mysql_rds: DET
      mysql_aurora: DET
      mysql_azure: DET
      oracle_rds: DET
      mssql_rds: DET
      mariadb_rds: DET
      pg_rds: DET      # cloud pg dbm_003: datum['rolvaliduntil']/rolname 필드 직접 비교 → DET
      pg_aurora: DET
      pg_azure: DET
    # pg native: 수집 형식 {"*": python_repr_str} — analysis가 'rolvaliduntil' KeyError 삼킴 → [] → 거짓양호(R3)
    # pg cloud: cloud_analysis에서 rolvaliduntil/rolname 필드 직접 접근 → DET (native와 다른 데이터 스키마)

  DBM-004:                          # 불필요 관리자권한
    variants:
      mysql: DET
      oracle: DET
      mssql: DET
      mariadb: DET
      pg: STUB
      # 클라우드 변형 (Phase 4b)
      mysql_rds: DET
      mysql_aurora: DET
      mysql_azure: DET
      oracle_rds: DET
      mssql_rds: DET
      mariadb_rds: DET
      pg_rds: DET      # cloud pg dbm_004: rolsuper/rolcreatedb/rolcreaterole 직접 비교 → DET
      pg_aurora: DET
      pg_azure: DET
    # pg native: 수집 형식 {"*": python_repr_str} — analysis가 'rolsuper' KeyError 삼킴 → [] → 거짓양호(R3)

  DBM-005:                          # 중요정보 암호화 — 결정론 부적합(검증TODO) → 전엔진 LLM (Batch1)
    variants:
      mssql: STUB                   # Batch1: sample is not None 약검사 → 자동취약 위험 → LLM (검증TODO)
      mysql: STUB
      oracle: STUB
      mariadb: STUB
      pg: STUB
      # 클라우드 변형 (Phase 4b): 모든 엔진 cloud도 동일 — lambda True=STUB 또는 실검사
      mysql_rds: STUB      # cloud mysql: [lambda datum: True] → STUB
      mysql_aurora: STUB
      mysql_azure: STUB
      oracle_rds: STUB     # cloud oracle: [lambda datum: True] → STUB
      mssql_rds: DET       # cloud mssql: datum['sample'] is not None → DET(실검사)
      mariadb_rds: STUB    # cloud mariadb: [lambda datum: True] → STUB
      pg_rds: ABSENT       # cloud pg: dbm_005 메서드 없음(run()에 미호출) → ABSENT
      pg_aurora: ABSENT
      pg_azure: ABSENT

  DBM-006:                          # 로그인 실패 제한
    variants:
      mysql: DET
      oracle: DET
      mssql: DET
      mariadb: DET
      pg: DET              # Batch1: pg_native는 db.py 모드B(구조적취약) 라우팅 — 코어 실패잠금 부재
      # 클라우드 변형 (Phase 4b)
      mysql_rds: DET       # cloud mysql: FAILED_LOGIN_ATTEMPTS/PASSWORD_LOCK_TIME_DAYS 비교 → DET(native와 다른 컬럼명)
      mysql_aurora: DET
      mysql_azure: DET
      oracle_rds: DET
      mssql_rds: DET
      mariadb_rds: DET
      pg_rds: ABSENT       # cloud pg: dbm_006 메서드 없음(run()에 미호출) → ABSENT
      pg_aurora: ABSENT
      pg_azure: ABSENT
    # pg native: 빈 본문(body=[] only) → STUB

  DBM-007:                          # 비밀번호 복잡도
    variants:
      mysql: DET
      oracle: DET
      mssql: DET
      mariadb: DET         # Batch1: STUB 오분류 정정 — 실데이터 실증(not loaded/SIMPLE_PASSWORD_CHECK 정상탐지)
      pg: DET              # Batch1: pg_native는 db.py 모드B(구조적취약) — 코어 복잡도강제 부재
      # 클라우드 변형 (Phase 4b)
      mysql_rds: DET       # cloud mysql: validate_password.policy 비교 → DET
      mysql_aurora: DET
      mysql_azure: DET
      oracle_rds: DET
