  # ─── 웹서버-WAS (WST) 웹 특화 항목 — Phase 3 전수 분류 ──────────────────────
  # meta.notes: "Phase3=웹특화 WST만; OS-동형 WST는 서버프로파일 담당, 데이터 SRV-NNN"
  # OS-동형 WST(WST-NNN 중 SRV 동형)는 실데이터에서 SRV ID로 수집되므로 이곳 미등재.
  # variant 키: apache/iis/webtob/tomcat/jeus/webservice (profile.WEBWAS 웹키)
  # 코드 근거: WST_Apache_parse.py / WST_IIS_parse.py / WST_WebtoB_parse.py의 check_WST_NNN 함수

  # OS variant DET-PARTIAL 원칙 (§6.2 웹서버 추론 지원):
  # detect_variant가 linux 등 OS 키를 반환하더라도, webwas 어댑터가 raw에서 웹서버 종류를
  # 추론해 WST check 함수를 호출할 수 있다. 이를 위해 OS 5종(linux/aix/hpux/solaris/win)을
  # DET-PARTIAL로 등재 → main.py gate 통과 → 어댑터가 raw 추론 시도.
  # 추론 실패 시 어댑터가 handled=False → LLM 폴백 (안전 기본값 유지).

  # WST-031: Directory Indexes — 3파서 config_dispatcher 등재
  WST-031:
    default: ABSENT              # tomcat/jeus/webservice 파서 없음
    variants:
      apache: DET
      iis: DET
      webtob: DET
      linux: DET-PARTIAL         # OS variant: raw에서 웹서버 추론 후 판정 시도
      aix: DET-PARTIAL
      hpux: DET-PARTIAL
      solaris: DET-PARTIAL
      win: DET-PARTIAL

  # WST-032: IIS 스크립트 경로 Everyone 권한 — IIS 전용
  WST-032:
    default: ABSENT
    variants:
      iis: DET
      win: DET-PARTIAL           # OS variant win: IIS 추론 후 판정 시도

  # WST-033: 웹서버 버전 — Apache DET, IIS DET, WebtoB NA→MANUAL((*) 반환)
  WST-033:
    default: ABSENT
    variants:
      apache: DET
      iis: DET
      webtob: MANUAL             # NA 처리: result='NA', reason에 (*) — Low-1 가드로 handled=False
      linux: DET-PARTIAL         # OS variant: raw에서 웹서버 추론 후 판정 시도
      aix: DET-PARTIAL
      hpux: DET-PARTIAL
      solaris: DET-PARTIAL
      win: DET-PARTIAL

  # WST-034: 불필요한 파일 — Apache MANUAL(*), IIS DET, WebtoB MANUAL(*)
