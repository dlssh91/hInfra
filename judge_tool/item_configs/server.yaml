# server(OS) 항목 라벨 & LLM 지시 — Phase 1 완성: 전 SRV 항목 5-way 라벨링
# label A: 기술 증거로 판정 가능 (LLM)
# label B: 담당자 인터뷰 필수 — verdict=판단보류 고정, LLM은 summary_instruction으로 증거 요약만
# label C: 기술적 한계 — 자동 판단보류, canned_message 출력 (LLM 호출 없음)
# label D: 외부지식 필요(EOL·패치 등) — 자동 판단보류, canned_message 출력 (LLM 호출 없음)
#
# variant 키: aix / hpux / linux / solaris / win (variants: 오버라이드 가능).
#
# ── Phase 1 완성: 전 SRV 항목(DET_SOURCE 기준 106개) 5-way 라벨링 ──
# 라벨링 규칙(우선순위):
#   1. EOL/패치(SRV-007/064/179) → D
#   2. 크랙 기술한계(SRV-022/075) → C
#   3. 인터뷰 필수(SRV-074/109/115/118) → B
#      ※SRV-074: linux=SRV_Linux_parse 실결정론(Opus M-1 검증됨) + label B 폴백(비-linux/파싱실패) — 자기모순 아님
#   4. linux classify==DET(위 1~3 제외) → judgment_method: det_common / label: A(폴백)
#   5. MANUAL + §15.4 LLM 가능 명시분 → A
#   6. ABSENT: §15.4 LLM 가능 명시분(SRV-027/091/144/163/165/166) → A; 나머지 → C
#   7. DET-PARTIAL(서비스상태 의존) → det_common + label: A 폴백
#      (사용자결정 2026-06-16: DET-PARTIAL 패스스루 — common 명확경로 결정론, (*)→LLM)
#      예외: SRV-006(§13.2 누락으로 패스스루 제외, label A LLM 유지)
#
# 분류 권위: judge_tool/vendor/common/DET_SOURCE.yaml
# 설계서 근거: DESIGN_common_deterministic_integration.md §14/§15/§16/§18.3

