# ─── B 라벨 — 인터뷰 필수 (verdict=판단보류 고정, summary_instruction으로 증거 요약) ─────

SRV-074:
  # 사용자 결정(2026-06-16): check_SRV_074(SRV_Linux_parse.py:372) 로직 = xlsx 판단기준과 정확 일치
  #   ("분기별 1회 이상 로그인 기록 없거나 / 비밀번호 90일 초과 미변경 → 취약") → 결정론 유지.
  #   xlsx "※ 업무상 사용 여부 확인 필요"는 needs_review=True(전 서버 항목)로 사람이 최종 확인.
  # Opus M-1 검증(2026-06-16): det_common + label B = 자기모순 아님.
  #   linux variant → SRV_Linux_parse.check_SRV_074 실결정론(실데이터 N/Y, (*) 없음) — 확인.
  #   비-linux/파싱실패 → (*) → Low-1 가드 → handled=False → label B 폴백(인터뷰). 의도된 설계.
  #   auto_parse의 check_SRV_074는 항상 (*) 스텁이나, linux variant에서는 SRV_Linux_parse가 우선됨.
  judgment_method: det_common     # linux=SRV_Linux_parse 실로직(실데이터 verdict 확인됨). 비-linux/파싱실패=B 폴백
  label: B                        # handled=False(파싱실패·비-linux variant) 폴백 = 인터뷰 — 자기모순 아님
  summary_instruction: "이 항목의 휴면계정 판정 증거를 정리하라: 마지막 로그인/패스워드 변경 90일 초과 계정 목록, 해당 계정의 업무 사용 여부 확인이 필요한 계정을 요약하라"

