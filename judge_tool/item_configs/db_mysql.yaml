# db_mysql 항목 라벨 & LLM 지시
# label A: 기술 증거로 판정 가능
# label B: 담당자 인터뷰 필수 — verdict=판단보류 고정, LLM은 summary_instruction으로 증거 요약만
# label C: 기술적 한계 — 자동 판단보류, canned_message 출력 (LLM 호출 없음)
# label D: 외부지식 필요 — 자동 판단보류, canned_message 출력 (LLM 호출 없음)
#
# Phase 4: DET 항목에 judgment_method: det_common 추가 (label 유지, needs_review=true)
# STUB/ABSENT 항목은 det_common 미부여(gate 차단이지만 일관성 위해 미적용).
# Phase 4c: DBM-001 det_common 부여 (사전공격 결정론화 — b 레이어).
#
# TODO(네이티브 지원): mysql_native 전용 항목 중 DBM-022/026/034는 점검
# 스크립트가 섹션을 출력하지 않아 '증거 미수집' 자동 판단보류로 처리됨(서버
# 스크립트 연계 후속 과제). 단 DBM-033(이중화)은 mysql.slave_master_info 섹션을
# 실제 출력 → default A로 LLM 판정됨. 평문 비밀번호 노출 판정 적정성은 실데이터
# 확보 후 라벨 재검토 필요.

DBM-001:
  judgment_method: det_common  # Phase 4c: db_pwcrack 사전공격 어댑터
  needs_review: true
  label: C
  canned_message: 비밀번호 해시가 확인되었으나, 사전공격으로 판단 불가(미지원 포맷 또는 수집 없음). 담당자가 비밀번호 정책 설정값(validate_password_length 등)으로 간접 확인 필요.
# 모드A2(classify-then-hold): det가 분류정보 생성+항상 판단보류. summary_instruction은 handled=False 폴백(LLM 요약)용으로 유지.
