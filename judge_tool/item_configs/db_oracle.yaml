# db_oracle 항목 라벨 & LLM 지시
# label A: 기술 증거로 판정 가능
# label B: 담당자 인터뷰 필수 — verdict=판단보류 고정, LLM은 summary_instruction으로 증거 요약만
# label C: 기술적 한계 — 자동 판단보류, canned_message 출력 (LLM 호출 없음)
# label D: 외부지식 필요 — 자동 판단보류, canned_message 출력 (LLM 호출 없음)
#
# Phase 4: DET 항목에 judgment_method: det_common 추가 (label 유지, needs_review=true)
# STUB/ABSENT 항목은 det_common 미부여.
# Phase 4c: DBM-001 det_common 부여 (사전공격 결정론화 — b 레이어; 현 native spare4 미수집 → handled=False → canned 폴백).
# oracle DBM-013: [lambda datum: True] 확인 → STUB (§B=ABSENT였으나 코드 확인 후 정정).
# oracle DBM-015: 015_1/2 [lambda datum: True] 확인 → oracle 전체 STUB.
#
# TODO(네이티브 지원): oracle_native 전용 항목 DBM-012(lsnrctl)/013/022/026/034는
# 점검 스크립트가 섹션을 출력하지 않아 '증거 미수집' 자동 판단보류로 처리됨.
# 실제 수집·판정은 서버 스크립트 연계 후속 과제. (DBM-014/029/030은 기존 A 유지.)

DBM-001:
  judgment_method: det_common  # Phase 4c: db_pwcrack 어댑터 (spare4 미수집 → handled=False → canned 폴백)
  needs_review: true
  label: C
  canned_message: 비밀번호 해시가 확인되었으나, 사전공격으로 판단 불가(spare4 미수집 또는 미지원 포맷). 담당자가 비밀번호 정책 프로파일(PROFILE) 설정값으로 간접 확인 필요.
DBM-003:
  judgment_method: det_common
  needs_review: true
  label: B
  summary_instruction: 계정 목록을 활성(ACCOUNT_LOCKED=N)/잠김(Y)/시스템내장(rdsadmin·mysql.sys
    등)으로 분류하여 요약. 의심 계정명(test·temp·old·backup 포함) 별도 표시. 판정하지 말 것.
DBM-004:
  judgment_method: det_common
  needs_review: true
  label: B
  summary_instruction: '증거의 권한 행을 계정별로 집계하여 요약 (예: admin@% — 27개: ALTER, CREATE 등).
    USAGE만 있는 계정은 ''일반 권한만''으로 표시. 판정하지 말 것.'
DBM-005:
  label: A
DBM-006:
  judgment_method: det_common
  needs_review: true
  label: A
