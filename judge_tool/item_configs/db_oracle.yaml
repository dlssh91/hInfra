  needs_review: true
  label: A
DBM-009:
  judgment_method: det_common
  needs_review: true
  label: A
DBM-011:
  judgment_method: det_common
  needs_review: true
  label: A
DBM-013:
  # oracle DBM-013: [lambda datum: True] → STUB(과탐). DET_SOURCE oracle=STUB → gate 차단(handled=False) → LLM 라우팅.
  # det_common 미부여(STUB이므로). 증거 있으면 LLM 판정, 증거 없으면 보수적 보류.
  # 양호 자동판정 금지 — oracle 원격접근통제는 네트워크/OS 레벨 확인이 추가로 필요.
  label: A
DBM-014:
  judgment_method: det_common
  needs_review: true
  label: A
DBM-015:
  label: B
  summary_instruction: PUBLIC에 부여된 권한을 유형별로 요약. SELECT 외 쓰기/실행 권한 별도 표시. 판정하지 말 것.
DBM-016:
  judgment_method: det_common
  needs_review: true
  label: D
  patch_check: true
  canned_message: DB 버전 정보 확인됨. 최신 보안패치 적용 여부는 Oracle CPU(Critical Patch Update) 릴리즈 노트 확인 필요. 로컬 LLM은 최신 패치 기준을 알 수 없어 판단 불가.
DBM-017:
  judgment_method: det_common
  needs_review: true
  label: B
  summary_instruction: 시스템 테이블 접근 권한을 계정/역할별로 집계하여 요약. 각 계정의 접근 테이블명과 권한 유형 나열. 판정하지
    말 것.
DBM-019:
  judgment_method: det_common
  needs_review: true
  label: A
DBM-020:
  judgment_method: det_common
  needs_review: true
  label: B
  summary_instruction: 계정 목록을 요약하라. 판정하지 말 것. 로그인 가능 계정(시스템 내장 계정 제외)과 시스템/내장 계정으로 추정되는 항목을 구분하여 나열. 공용 계정명 패턴(admin·operator·dba·shared·common 등)이 있으면 별도 표시. 마지막에 "각 계정이 사용자 1인당 1계정으로 운영되는지, 공유 계정은 없는지 담당자 인터뷰 확인 필요" 추가.
