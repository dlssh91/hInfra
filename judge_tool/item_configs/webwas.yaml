# webwas(웹서버-WAS) 항목 라벨 & LLM 지시 — 스캐폴드(구조 단계)
# label A: 기술 증거로 판정 가능 (LLM)
# label B: 담당자 인터뷰 필수 — verdict=판단보류 고정, LLM은 summary_instruction으로 증거 요약만
# label C: 기술적 한계 — 자동 판단보류, canned_message 출력 (LLM 호출 없음)
# label D: 외부지식 필요(EOL·패치 등) — 자동 판단보류, canned_message 출력 (LLM 호출 없음)
#
# 현재 상태: 항목 미등재 → 전 항목(126개 WST) 기본 label A(LLM 판정).
# variant 키: OS 5종(aix/hpux/linux/solaris/win) + 웹서버 6종
#             (webservice/apache/webtob/iis/tomcat/jeus).
#
# 시트 구성: 총 126항목(WST-001~126). 서버(SRV)와 항목명 동일 106개(OS 점검)
# + 웹 특화 20개(WST-031~044 등 ID 구간 산재, 연속 아님).
# 웹 특화 항목은 OS 변형 컬럼에 판단기준이 복제돼 있어 OS 변형 선택 시에도 판정됨.
#
