# webwas(웹서버-WAS) 항목 라벨 & LLM 지시
# Phase 3 완료: 웹 특화 WST 항목 5-way 라벨 등재.
#
# label A: 기술 증거로 판정 가능 (LLM)
# label B: 담당자 인터뷰 필수 — verdict=판단보류 고정, LLM은 summary_instruction으로 증거 요약만
# label C: 기술적 한계 — 자동 판단보류, canned_message 출력 (LLM 호출 없음)
# label D: 외부지식 필요(EOL·패치 등) — 자동 판단보류, canned_message 출력 (LLM 호출 없음)
#
# variant 키: OS 5종(aix/hpux/linux/solaris/win) + 웹서버 6종
#             (webservice/apache/webtob/iis/tomcat/jeus).
#
# ★OS/웹 이중성 게이트 (Phase 3 확정):
# - 실수집 데이터에서 OS 항목 = SRV-NNN ID로 emit, 웹 특화 = WST-NNN.
# - webwas 어댑터가 SRV-* → server 어댑터 위임, WST-* → WST check 함수.
# - criteria 웹서버-WAS 시트는 WST-001~126 전부 WST ID (SRV 혼재 없음, 126항목).
# - OS-동형 WST(WST-NNN 중 SRV 동형): 실데이터 SRV ID ↔ criteria WST ID 불일치로
#   webwas 프로파일에서 매칭 안 됨 → 서버 프로파일(Phase 1)이 SRV-NNN으로 담당.
# - webwas Phase 3 결정론 범위 = 웹특화 WST 항목만 (수집 WST-NNN 증거 있는 것).
#
# TODO(후속 과제):
# - server.yaml OS 항목 라벨을 항목명 기준으로 WST에 동기화(ID 직접 매핑 금지).
# - WST-126 EOL: eol.yaml 웹서버 테이블 추가 후 D eol_check 전환.
# - WST-080 보안패치: patch_check 후보.
# - iis/webtob/tomcat/jeus 실수집 샘플 확보 후 합성 픽스처 → 실데이터 검증 업그레이드.

