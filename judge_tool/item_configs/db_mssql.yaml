  judgment_method: det_common
  needs_review: true
  label: A
DBM-007:
  judgment_method: det_common
  needs_review: true
  label: A
DBM-008:
  judgment_method: det_common
  needs_review: true
  label: A
DBM-009:
  label: A
DBM-011:
  # Phase 4e: det_common 부여 — mssql dbm_011 활성 감사 탐지 로직 추가 후 DET 승격.
  # ⚠️ NOTE 우선순위 함정: NOTE("...refer to PISM-011")가 항상 존재하지만,
  #    det_common 경로(_det_common_handler)는 NOTE 강제보류를 거치지 않음 →
  #    미수집(0행) → 취약이 NOTE에 안 가려짐(거짓음성 방지).
  judgment_method: det_common
  needs_review: true
  label: A
DBM-013:
  # mssql DBM-013: 빈 본문(STUB) → DET_SOURCE mssql=STUB → gate 차단 → 증거 미수집 보류.
  # 원격접근통제는 pg_hba.conf/OS 방화벽 레벨로 SQL 스크립트 미수집(확인됨).
  # det_common 미부여. 양호 자동판정 절대 금지.
  label: A
DBM-015:
  # label B(인터뷰)로 이관. judgment_method: det_common 제거.
  # 사유: mssql config rules['DBM-015']['permission_name']=[] (빈 목록) → datum['permission_name'] in [] 항상 False
  # → 위반 0건 → handled=True + 양호(거짓양호). label B → classify_method=interview → _summarize_one 라우팅.
  label: B
  summary_instruction: "PUBLIC Role에 부여된 권한/Role을 담당자 인터뷰가 쉽도록 정리하라.\
    \ ① 시스템 기본 권한(sys·INFORMATION_SCHEMA·master·msdb·tempdb 등,\
    \ 모든 DB에 기본 존재=정상)과 업무 객체(사용자 스키마/테이블) 권한을 구분.\
    \ ② 업무 테이블/객체에 부여된 DML(INSERT·UPDATE·DELETE·TRUNCATE 등) 권한을\
    \ '업무상 불필요 의심'으로 우선 나열.\
    \ ③ 권한 유형·대상 객체별로 묶어 간결히 요약.\
    \ 판정(양호/취약)은 내리지 말고 담당자가 '업무상 불필요 여부'를 빠르게 확인하도록 정리만 하라."
DBM-016:
  judgment_method: det_common
  needs_review: true
  label: D
  patch_check: true
  canned_message: DB 버전 정보 확인됨. 최신 보안패치 적용 여부는 Microsoft SQL Server 누적 업데이트(CU) 릴리즈 노트 확인 필요. 로컬 LLM은 최신 패치 기준을 알 수 없어 판단 불가.
DBM-017:
  # label B(인터뷰). judgment_method: det_common 없음(빈본문 → STUB).
  # mssql native DBM-017 본문 비어있음 → STUB 확정(§B=MANUAL이었으나 빈본문이므로 STUB이 보수적).
  # label B → classify_method=interview → _summarize_one 라우팅(det_common 어댑터 미호출).
  label: B
  summary_instruction: "시스템 테이블/딕셔너리에 부여된 접근 권한을 담당자 인터뷰가 쉽도록 정리하라.\
    \ ① 시스템 계정·DBA·기본 부여(sys·INFORMATION_SCHEMA·master·msdb·tempdb 등, 정상)와\
    \ 일반/업무 계정에 부여된 시스템테이블 권한을 구분.\
    \ ② 일반 계정·PUBLIC에 부여된 시스템테이블 접근/DML 권한을\
    \ '업무상 불필요 의심'으로 우선 나열(GRANTEE·권한유형·테이블별).\
    \ ③ 간결히 묶어 요약.\
    \ 판정(양호/취약)은 내리지 말고 담당자가 '업무상 불필요 여부'를 빠르게 확인하도록 정리만 하라."
DBM-019:
  judgment_method: det_common
  needs_review: true
  label: A
DBM-020:
  needs_review: true
  label: B
  summary_instruction: 계정 목록을 요약하라. 판정하지 말 것. 로그인 가능 계정(시스템 내장 계정 제외)과 시스템/내장 계정으로 추정되는 항목을 구분하여 나열. 공용 계정명 패턴(admin·operator·dba·shared·common 등)이 있으면 별도 표시. 마지막에 "각 계정이 사용자 1인당 1계정으로 운영되는지, 공유 계정은 없는지 담당자 인터뷰 확인 필요" 추가.
DBM-021:
  # label C: ODBC/OLE-DB 데이터소스·드라이버는 SQL 질의로 점검 불가(OS 레지스트리/관리콘솔 레벨).
  # 점검 스크립트(mssql.sql)도 "Self-Managed: 콘솔에서 확인, CSP-Managed: N/A"로 명시, 벤더 analysis.py도 동일.
  label: C
  canned_message: "ODBC/OLE-DB 데이터소스·드라이버는 SQL 질의로 점검 불가(OS 레지스트리/관리콘솔 레벨) → 관리콘솔에서 업무상 불필요한 데이터소스·드라이버 제거 여부 확인 필요(판단보류)."
DBM-022:
  # label C: MSSQL 설정·데이터 파일 권한은 Windows 파일 ACL이라 SQL 질의로 점검 불가.
  # mssql.sql에 DBM-022 항목 없음, 서버(Windows) 스크립트(fsi_win.bat)도 DBM-022 전용 수집 없음.
  label: C
  canned_message: "MSSQL 설정·데이터 파일 권한은 Windows 파일 ACL이라 SQL 질의로 점검 불가 → 서버(Windows) 점검 또는 콘솔에서 파일 접근권한 적절성 확인 필요(판단보류)."
