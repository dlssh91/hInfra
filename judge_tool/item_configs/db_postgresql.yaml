# db_postgresql 항목 라벨 & LLM 지시
# label A: 기술 증거로 판정 가능
# label B: 담당자 인터뷰 필수 — verdict=판단보류 고정, LLM은 summary_instruction으로 증거 요약만
# label C: 기술적 한계 — 자동 판단보류, canned_message 출력 (LLM 호출 없음)
# label D: 외부지식 필요 — 자동 판단보류, canned_message 출력 (LLM 호출 없음)
#
# Phase 4: DET 항목에 judgment_method: det_common 추가 (label 유지, needs_review=true)
# STUB(DBM-005/006/007/013/019/028/032) 항목은 det_common 미부여.
# Phase 4c: DBM-001 det_common 부여 (사전공격 결정론화 — b 레이어).
# pg DBM-028: [lambda datum: True] × 3 → STUB (거짓취약 방지)
#
# TODO(네이티브 지원): pg_native에서 새로 평가대상이 되는 항목 처리
#  - DBM-001: 아래 label C 추가(해시 복잡도 기술 판정 불가, 타 엔진과 동일).
#  - DBM-007: 클라우드 전용 C 메시지가 네이티브에 오적용되지 않도록 pg_native
#    variant 오버라이드(label A)를 둠 — 네이티브는 passwordcheck 설치 가능,
#    스크립트가 shared_preload_libraries 섹션을 출력하므로 LLM이 판정.
#  - DBM-006/013/019/022/026/032/034: 점검 스크립트가 섹션을 출력하지 않아
#    '증거 미수집' 자동 판단보류로 처리됨(서버 스크립트 연계 후속 과제).

DBM-001:
  judgment_method: det_common  # Phase 4c: db_pwcrack 사전공격 어댑터
  needs_review: true
  label: C
  canned_message: 비밀번호 해시가 확인되었으나, 사전공격으로 판단 불가(미지원 포맷 또는 수집 없음). 담당자가 비밀번호 정책(passwordcheck 확장·내부 규정 등)으로 간접 확인 필요.
DBM-003:
  # det_common 제거 (R3 보수처리): pg 수집형식 {"*": python_repr} → analysis KeyError → 거짓양호
  # DET_SOURCE pg=STUB 정정 완료. 수집형식 수정 후 DET 복원 가능.
  needs_review: true
  label: B
  summary_instruction: 계정 목록을 활성(ACCOUNT_LOCKED=N)/잠김(Y)/시스템내장(rdsadmin·mysql.sys
    등)으로 분류하여 요약. 의심 계정명(test·temp·old·backup 포함) 별도 표시. 판정하지 말 것.
DBM-004:
  # det_common 제거 (R3 보수처리): pg 수집형식 {"*": python_repr} → analysis KeyError → 거짓양호
  needs_review: true
  label: B
  summary_instruction: '증거의 권한 행을 계정별로 집계하여 요약 (예: admin@% — 27개: ALTER, CREATE 등).
    USAGE만 있는 계정은 ''일반 권한만''으로 표시. 판정하지 말 것.'
DBM-005:
  label: A
DBM-006:
  label: A
  variants:
    pg_native:
      # Batch1: db.py 모드B(구조적취약 — PostgreSQL 코어 실패잠금 부재). gate DET 승격.
      judgment_method: det_common
      label: A
DBM-007:
  label: C
  canned_message: 클라우드 관리형 PostgreSQL(RDS/Aurora/Azure)에서는 passwordcheck.so 확장을 설치할 수 없어 기술 증거만으로 비밀번호 복잡도 정책 충족 여부를 판단할 수 없다. 복잡도 정책은 클라우드 콘솔·파라미터 그룹·IAM 정책으로 관리되므로 담당자 인터뷰로 확인 필요.
  variants:
    pg_native:
      # Batch1: db.py 모드B(구조적취약 — PostgreSQL 코어 복잡도강제 부재). gate DET 승격.
      judgment_method: det_common
      label: A
DBM-008:
  # Batch1: db_json pg 정규화 후 rolvaliduntil 비교 동작 → native DET 복원(클라우드 변형 불변)
  needs_review: true
  label: A
  variants:
    pg_native:
      judgment_method: det_common
      label: A
    pg_azure:
      label: B
      summary_instruction: 비밀번호 만료일(valuntil) 설정 현황을 계정별로 요약하라. 판정하지 말 것. 만료일이 명시된 계정, NULL(무기한)인 계정, 마스킹되어 확인 불가한 계정을 구분하여 나열. 마지막에 "비밀번호 변경 주기가 분기(90일) 1회 기준을 충족하는지 담당자 인터뷰 확인 필요" 추가.
DBM-009:
  judgment_method: det_common
  needs_review: true
  label: A
