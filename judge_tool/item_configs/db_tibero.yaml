# db_tibero 항목 라벨 & LLM 지시
# label A: 기술 증거로 판정 가능
# label B: 담당자 인터뷰 필수 — verdict=판단보류 고정, LLM은 summary_instruction으로 증거 요약만
# label C: 기술적 한계 — 자동 판단보류, canned_message 출력 (LLM 호출 없음)
# label D: 외부지식 필요 — 자동 판단보류, canned_message 출력 (LLM 호출 없음)
#
# ⚠️ 배선 갭(2026-07-11, 실샘플 없음 — collected/db에 tibero 실수집 데이터 부재):
#   아래 항목별 DET 분류는 (1) vendor/common/db/tibero/analysis.py(315줄) 코드 정독,
#   (2) tibero-config.json, (3) 기준 xlsx(데이터베이스 시트, applicability_col=26,
#   standard_col=55, method_col=56) 원문 대조로 정했다. **collected/db에 tibero_result
#   실샘플이 없어 실데이터로 vendor 필드명 가정(예: DBM-008/013의 'value' 필드,
#   DBM-011의 'value' 필드)을 검증하지 못했다** — 5엔진 실수집으로 F1~F9를 발견한
#   전례(KNOWN_BUGS.md)에 비추어, tibero 실샘플 확보 후 반드시 재검증 필요(후속 과제).
#   이번 라운드는 합성 픽스처(tests/db_cov_contract.py _TIBERO)로만 배선을 검증했다.
#
# ⚠️ 발견된 vendor 로직 이상(수정 안 함 — vendor 읽기전용 원칙, 여기 문서화만):
#   DBM-030: analysis.py dbm_030()이 `datum['table'] == "AUD$"` 를 조건으로 쓴다.
#     "AUD$"는 **Oracle**의 감사테이블명이고, 기준 xlsx(col55/56)는 Tibero의 감사
#     테이블을 "SYS._DD_AUD"로 명시한다 — oracle analysis.py를 복사하면서 테이블명을
#     갱신하지 않은 것으로 보인다(oracle 원본과 조건문 완전 동일, 표 26 참조). 실수집
#     데이터의 'table' 필드가 "SYS._DD_AUD"(또는 유사)로 온다면 이 조건은 **항상 거짓**이
#     되어 위반이 전혀 잡히지 않는다 — DET로 신뢰하면 구조적 거짓양호가 된다. 따라서
#     본 배선에서는 DBM-030을 DET로 승격하지 않고 label B(인터뷰, 다른 엔진과 동일)로
#     고정했다. vendor 수정은 이번 태스크 범위 밖(로직 무변경 원칙) — 실샘플 확보 시
#     테이블명 정정 여부를 vendor 담당자와 확인 후 재평가할 것.
#
# label B(인터뷰) 항목에는 judgment_method: det_common을 넣지 않는다(DBM-020/024/028
# 교훈 — 자동판정 우회 방지). db.py 모드A(DBM-004)/모드A2(DBM-003)만 label B이면서
# 예외적으로 det_common을 쓴다(항상 판단보류로 귀결되는 설계이므로 안전).
#
# db_mariadb.yaml(구조 최단순) 템플릿 기준, 동일 항목번호는 5엔진과 동일 라벨 유지.

DBM-001:
  # DBM-001은 db.py judge()에서 base=="DBM-001"이면 TiberoAnalysis 결과를 무시하고
  # db_pwcrack.crack_judge(engine="tibero", ...)로 직행한다(결정5, 전 엔진 공통).
  # db_pwcrack.crack_judge의 엔진별 계정파싱 분기(mariadb/mysql/mssql/postgresql/oracle)에
  # "tibero"가 없어 항상 else 분기("미지원 엔진") → handled=False → canned 폴백.
  # 실크랙은 발생하지 않는다(안전한 판단보류 방향의 갭 — 후속 과제: db_pwcrack에
  # tibero 계정 파싱 추가).
  judgment_method: det_common
  needs_review: true
  label: C
  canned_message: 비밀번호 해시가 확인되었으나, 사전공격으로 판단 불가(Tibero 계정 파싱 미지원 또는 미수집). 담당자가 비밀번호 정책 설정값(계정 프로파일 등)으로 간접 확인 필요.
# 모드A2(classify-then-hold): det가 분류정보 생성+항상 판단보류. summary_instruction은 handled=False 폴백(LLM 요약)용으로 유지.
# ⚠️ db.py의 _dbm003_collect_rows/_dbm003_classify_account에 engine=="tibero" 분기가
# 없다 — 항상 "계정목록 미수집" 안전 판단보류로 폴백한다(활성/잠김·만료 분류 정리정보는
# 제공되지 않음, 거짓양호/거짓취약 없음). 계정분류 정리정보까지 필요하면 후속 과제로
# db.py에 tibero 분기(username/account_status/expiry_date 필드, oracle과 거의 동일 스키마)
# 추가 검토.
DBM-003:
  judgment_method: det_common
  needs_review: true
  label: B
  summary_instruction: 계정 목록을 활성/잠김·만료/시스템내장(SYS·SYSCAT·SYSGIS·OUTLN 등)으로
    분류하여 요약. 의심 계정명(test·temp·old·backup 포함) 별도 표시. 판정하지 말 것.
DBM-004:
  judgment_method: det_common
  needs_review: true
  label: B
  summary_instruction: '증거의 권한 행을 계정(grantee)별로 집계하여 요약(ADMIN_OPTION=YES 여부
