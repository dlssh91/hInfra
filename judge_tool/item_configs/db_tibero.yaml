  judgment_method: det_common
  needs_review: true
  label: A
DBM-007:
  # 비밀번호 복잡도 — PASSWORD_VERIFY_FUNCTION 스키마가 oracle과 동일(기준 xlsx 원문도
  # "① 검증함수 할당여부 ② 함수 내용이 복잡도를 만족하는지" 2단계로 oracle과 문구까지
  # 거의 동일함을 확인). tibero-config.json rules.DBM-007.limit=["NULL_VERIFY_FUNCTION"]
  # (함수 미할당 sentinel). vendor data_key='DBM-007_1'(result_key 'DBM-007'과 다름 —
  # 조회 시 혼동 주의). db.py 모드C2(oracle 전용 detect-vuln-else-hold)를 이번 배선에서
  # engine=="tibero"까지 확장했다(OBS-OR007과 동일 근거: 함수 미할당→취약 확정 가능,
  # 함수 할당됨→내용 검증 불가하므로 양호 대신 판단보류 — 결정론 양호 금지).
  judgment_method: det_common
  needs_review: true
  label: A
DBM-008:
  # 비밀번호 주기변경 — 기준 xlsx 원문: "Tibero에서는 비밀번호 변경일자 조회 기능을
  # 제공하지 않으므로 비밀번호 만료 정책을 보고 판단"과 일치하게, vendor가 username/
  # profile(exception 필터, tibero-config엔 둘 다 빈 리스트라 항상 통과) + limit in
  # rules.limit(["UNLIMITED"]) 조건으로 만료정책 미설정(limit=='UNLIMITED')을 취약으로
