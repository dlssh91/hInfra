DBM-005:
  # 중요정보 암호화 — 5엔진 전체 정책(Batch1): 결정론 부적합 → LLM. tibero vendor
  # dbm_005는 table_name not in {DBA_ROLES,DBA_USERS} 필터일 뿐 암호화 여부를 검사하지
