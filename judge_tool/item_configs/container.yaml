# container(컨테이너 가상화 시스템) 항목 라벨 & 판정방식
# label A: LLM 판정 (기본)
# label B: 인터뷰 필수 — verdict=판단보류 고정, LLM은 증거 요약만
# label C: 기술적 한계 / 외부정보 필요 — 자동보류, canned_message 출력
# label D: EOL/패치 결정론 — 자동보류 (eol.yaml 연계)
#
# Phase 2 업데이트: PRCC-001~050 전수 라벨링 + det_common 지정.
# DET_SOURCE에 등재된 DET/DET-PARTIAL variant를 가진 항목은 det_common.
# gate가 variant별로 DET→결정론, MANUAL/ABSENT→LLM 폴백으로 자동 분기(§2.4).
# label은 전 항목 A(LLM 폴백 기본): 결정론이 차단된 variant/항목은 LLM으로.
#
# 라벨 원칙(§5.1 설계 계약):
#   - 결정론 분류는 DET_SOURCE(코드 근거)가 권위. 라벨은 폴백 경로 지정.
#   - PRCC-004(§15.4 D언급): 코드는 k8s=M/ocp=DET → DET_SOURCE대로 det_common+A.
#     EOL이 아니므로 D 부적합; §15.4 D언급은 코드 불일치 → 코드 우선(§13.2).
#   - PRCC-039(§15.4 B언급): docker_linux=DET → det_common+A. B 고정은 docker
#     결정론 손실이므로 부적합 → A 폴백 권장(§5.1).
#   - PRCC-024/036(§15.4 A): 코드상 master/docker DET → det_common+A.
#
# 변형 키: k8s_master / k8s_worker / eks_master / eks_worker /
#           aks_master / aks_worker / ocp_master / ocp_worker / docker_linux

# ─ PRCC-001~050 전수 (Phase 2, DET_SOURCE 기준 5-way 라벨) ─────────────────

