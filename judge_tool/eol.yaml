# DBM-025(EOL)·DBM-016(패치) 결정론 판정 테이블
#
# 갱신 규칙:
#   - as_of: 이 테이블을 마지막으로 벤더 공식 정책과 대조한 날짜.
#   - 평가기준 개정 시 또는 분기 1회 https://endoflife.date 와 대조해 갱신할 것.
#   - eol: 벤더 공식 지원(Premier/Standard) 종료일. Extended Support 계약이
#     있는 기관은 별도 확인 필요(주석 참고).
#   - latest: 해당 시리즈의 최신 패치 버전(DBM-016 대조용). 관리형 서비스
#     (RDS/Aurora/Azure)는 커뮤니티 최신과 패치 채널이 다를 수 있으므로
#     '후보 표시'까지만 하고 verdict는 판단보류를 유지한다.
# 출처: endoflife.date API + 벤더 vendor/common/db/config/*-config.json 대조
#       (2026-06-17 갱신 — DBM-016 STUB 전환으로 judge_patch 힌트 경로 활성화)
# ★ 정책(2026-06-17): DBM-016 자동 verdict 금지. judge_patch는 현재버전 vs
#   latest 비교해 "미적용 후보" 힌트만 제공하고 verdict=판단보류 고정.
#   as_of 이후 벤더 릴리즈 발생 시 latest를 수동 갱신할 것.
#
# 2026-07-11 갱신 (EoS 커버리지 보강, [[patch-eol-baseline-policy]]):
#   주요 EoS 경과 버전(oracle 11g/18c, mysql 5.6/5.7, mssql 2012, pg 9.6~12,
#   mariadb 10.1~10.5)이 미등재라 judge_eol이 "테이블 미수록→판단보류"로만
#   귀결되던 것을 벤더 공식 EoS 등재로 "EoS 경과 확인→판단보류(사유 명확화)"로
#   전환. 각 신규 항목에 출처 URL 주석 필수(추측 금지, 확실한 공식 EoS만).
#   불확실 항목(날짜 확신 부족·표 구조상 시리즈 키 충돌)은 등재하지 않고
#   제외 사유를 주석/PROGRESS.md에 남김:
#     - oracle 12.1/12.2: eol.py _series()가 parts[0]만 취해 12.1/12.2가
#       모두 시리즈 키 "12"로 충돌(구분 불가) + 소스별 종료일 편차(2021-07~
#       2022-03) 확신 부족 → 제외.
#     - mariadb 10.6: EoS가 현재일(2026-07-11)에 근접한 경계 케이스라
#       일자 단위 확신 부족(오탐 위험) → 제외.
#     - mariadb 10.7~10.10(단기지원), postgresql 9.5 이하: 정확한 종료일
#       확신 부족 → 제외.
as_of: 2026-07-11
products:
  mysql:
    # latest 출처: eol.yaml 2026-06-10 기준 + mysql-config.json "2025.9.18 Release Notes" 대조
    # 더 최신값 우선(config < eol 이면 eol 유지, config > eol 이면 config 반영)
    "5.6": {eol: 2021-02-05}   # 출처: https://endoflife.date/mysql (벤더 공식 EoS 2021-02-05) — 2026-07-11 확인
    "5.7": {eol: 2023-10-31}   # 출처: https://endoflife.date/mysql (벤더 공식 EoS 2023-10-31) — 2026-07-11 확인
    "8.0": {eol: 2026-04-30, latest: "8.0.46"}   # eol.yaml 기존 8.0.46 ≥ config 8.0.43 → 유지
    "8.4": {eol: 2032-04-30, latest: "8.4.9"}    # eol.yaml 기존 8.4.9 ≥ config 8.4.6 → 유지
    "9.0": {eol: 2025-10-01, latest: "9.0.1"}    # config 9.0.1 (Innovation — 단기지원) 추가
    "9.4": {eol: 2034-04-21}                      # Innovation(최신), latest 미확정
    # 구 9.6/9.7 시리즈키 제거 (MySQL 버전체계: 8.x/9.x; 9.6은 PostgreSQL임)
  mariadb:
    # 출처(10.1~10.5): https://mariadb.org/about/#maintenance-policy +
    # https://endoflife.date/mariadb (벤더 공식 EoS) — 2026-07-11 확인.
    # 10.6(LTS, EoS 2026-07 경) 이후는 현재일과 근접해 일자 확신 부족으로 제외.
    "10.1": {eol: 2020-10-17}
    "10.2": {eol: 2022-05-23}
    "10.3": {eol: 2023-05-25}
    "10.4": {eol: 2024-06-18}
    "10.5": {eol: 2025-06-24}
    "10.11": {eol: 2028-02-16, latest: "10.11.18"}
    "11.4": {eol: 2029-05-29, latest: "11.4.12"}   # Extended: 2033-01-16
    "11.8": {eol: 2028-06-04}                       # Extended: 2033-10-22
    "12.3": {eol: 2029-06-30}
  mssql:                  # 시리즈 키 = 제품 연도. latest는 빌드 번호로 대조.
    # latest 출처: eol.yaml 2026-06-10 + mssql-config.json update "2025.10" 대조 (더 최신 우선)
    "2012": {eol: 2022-07-12}   # 출처: https://endoflife.date/mssqlserver (Extended Support 종료 2022-07-12) — 2026-07-11 확인
    "2014": {eol: 2024-07-09}                          # Extended: 2027-07-12 (SP3 기준)
    "2016": {eol: 2026-07-14}                          # Extended: 2029-07-17 (SP3 기준)
    "2017": {eol: 2027-10-12, latest: "14.0.3490.10"} # config 2025.10 신규 추가
    "2019": {eol: 2030-01-08, latest: "15.0.4470.1"}  # eol 기존 4470.1 ≥ config 4430.1 → 유지
    "2022": {eol: 2033-01-11, latest: "16.0.4255.1"}  # eol 기존 4255.1 ≥ config 4215.2 → 유지
    "2025": {eol: 2036-01-06}                          # latest 미확정
  postgresql:
    # latest 출처: eol.yaml 2026-06-10 + postgresql-config.json "2025.09" 대조 (더 최신 우선)
    # 9.6~12 출처: https://www.postgresql.org/support/versioning/ +
    # https://endoflife.date/postgresql (벤더 공식, 매년 11월 둘째 목요일 EoS) — 2026-07-11 확인
    "9.6": {eol: 2021-11-11}
    "10": {eol: 2022-11-10}
    "11": {eol: 2023-11-09}
    "12": {eol: 2024-11-14}
    "13": {eol: 2025-11-13, latest: "13.23"}   # eol 기존 13.23 ≥ config 13.22 → 유지
    "14": {eol: 2026-11-12, latest: "14.23"}   # eol 기존 14.23 ≥ config 14.19 → 유지
    "15": {eol: 2027-11-11, latest: "15.18"}   # eol 기존 15.18 ≥ config 15.14 → 유지
    "16": {eol: 2028-11-09, latest: "16.14"}   # eol 기존 16.14 ≥ config 16.10 → 유지
    "17": {eol: 2029-11-08, latest: "17.10"}   # eol 기존 17.10 ≥ config 17.6 → 유지
    "18": {eol: 2030-11-14}                    # 최신 major, latest 미확정
  oracle:
    # latest 출처: oracle-config.json date "2025.09 기준"
    # DB 수집버전은 "Database Release Update : 19.28.0.0.250715" 형식.
    # eol.py _PATTERNS db_oracle: re.compile(r"Database Release Update\s*:\s*(\d[\d.]*)")
    # → 추출버전 시리즈 = parts[0] = "19"/"21" (주버전). latest도 주버전.시리즈로 일치시킴.
    # 11(11.2.0.4)/18(18c) 출처: https://endoflife.date/oracle-database +
    # Oracle Lifetime Support Policy(벤더 공식, 11.2.0.4 Extended Support 종료
    # 2020-12-31 / 18c는 Extended Support 미제공, Premier 종료 2021-06-30이
    # 사실상 EoS) — 2026-07-11 확인. 12.1/12.2는 시리즈 키 충돌+확신 부족으로 제외(위 주석 참고).
    "11": {eol: 2020-12-31}
    "18": {eol: 2021-06-30}
    "19": {eol: 2029-12-31, latest: "19.28.0.0.250715"}  # Premier. Extended: 2032-12-31. RU 2025.07
    "21": {eol: 2027-07-31}                               # latest 미확정(RU API 미제공)
    "23": {eol: 2031-12-31}                               # latest 미확정
